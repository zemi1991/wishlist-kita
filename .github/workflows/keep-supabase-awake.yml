# Ping Supabase sekali sehari supaya projek percuma tak di-pause kerana tidak aktif.
# Kunci di bawah ialah anon key awam (sama seperti dalam config.js), bukan kunci rahsia.
name: Keep Supabase awake

on:
  schedule:
    - cron: "17 3 * * *"   # setiap hari 03:17 UTC (11:17 pagi waktu Malaysia)
  workflow_dispatch:        # boleh juga dijalankan manual dari tab Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping database and reminder function
        env:
          SUPABASE_URL: https://ggdhadswkfxtobkwticn.supabase.co
          ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdnZGhhZHN3a2Z4dG9ia3d0aWNuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQyNTg5NDMsImV4cCI6MjEwOTgzNDk0M30.yo0Zj733nnhO_bUNWxcIbat9UQ1Ca7XP_ViudxACD9I
        run: |
          set -e
          # Fungsi ini membaca database, jadi ia mengira sebagai aktiviti
          curl -fsS "$SUPABASE_URL/functions/v1/send-reminders?key=1" \
            -H "apikey: $ANON_KEY" -H "Authorization: Bearer $ANON_KEY" -o /dev/null
          # Panggilan REST terus ke database
          curl -fsS "$SUPABASE_URL/rest/v1/categories?select=id&limit=1" \
            -H "apikey: $ANON_KEY" -H "Authorization: Bearer $ANON_KEY" -o /dev/null
          echo "Supabase is awake"
